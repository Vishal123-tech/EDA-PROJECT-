<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f8fafc">HR Analytics · Job Change Overview</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="17" fill="#bfdbfe">Training data: 19,158 candidates | Target distribution and education profile</text>
  <rect x="70" y="145" width="500" height="475" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="610" y="145" width="520" height="475" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="105" y="195" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Job-change intention</text>
  <text x="105" y="222" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Target label in aug_train.csv</text>
  <circle cx="320" cy="385" r="112" fill="none" stroke="#e2e8f0" stroke-width="34"/>
  <circle cx="320" cy="385" r="112" fill="none" stroke="url(#blue)" stroke-width="34" stroke-dasharray="527 177" transform="rotate(-90 320 385)"/>
  <circle cx="320" cy="385" r="112" fill="none" stroke="url(#coral)" stroke-width="34" stroke-dasharray="177 527" stroke-dashoffset="-527" transform="rotate(-90 320 385)"/>
  <text x="320" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">19,158</text>
  <text x="320" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">candidates</text>
  <rect x="118" y="520" width="16" height="16" rx="4" fill="#2563eb"/><text x="145" y="534" font-family="Arial, sans-serif" font-size="16" fill="#334155">Not looking to change</text><text x="450" y="534" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">14,381 · 75.1%</text>
  <rect x="118" y="556" width="16" height="16" rx="4" fill="#f97316"/><text x="145" y="570" font-family="Arial, sans-serif" font-size="16" fill="#334155">Looking to change</text><text x="450" y="570" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">4,777 · 24.9%</text>
  <text x="650" y="195" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Most common education levels</text>
  <text x="650" y="222" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Top categories in the training dataset</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <text x="650" y="275">Graduate</text><text x="650" y="345">Masters</text><text x="650" y="415">High School</text><text x="650" y="485">Phd</text><text x="650" y="555">Primary School</text>
  </g>
  <g fill="url(#blue)">
    <rect x="790" y="252" width="290" height="30" rx="8"/><rect x="790" y="322" width="109" height="30" rx="8"/><rect x="790" y="392" width="50" height="30" rx="8"/><rect x="790" y="462" width="11" height="30" rx="8"/><rect x="790" y="532" width="8" height="30" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a"><text x="1090" y="275" text-anchor="end">11,598</text><text x="1090" y="345" text-anchor="end">4,361</text><text x="1090" y="415" text-anchor="end">2,017</text><text x="1090" y="485" text-anchor="end">414</text><text x="1090" y="555" text-anchor="end">308</text></g>
  <text x="70" y="680" font-family="Arial, sans-serif" font-size="14" fill="#bfdbfe">Source: HR Analytics: Job Change of Data Scientists · Exploratory analysis</text>
</svg>
